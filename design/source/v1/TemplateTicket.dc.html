<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
@font-face{font-family:'Monoplex KR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_Monoplex-kr@1.0/MonoplexKR-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Monoplex KR';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_Monoplex-kr@1.0/MonoplexKR-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:640px;box-sizing:border-box;padding:48px 32px;background:linear-gradient(180deg,#163A7A 0%,#1F4FA3 55%,#2E6BD1 100%);display:flex;flex-direction:column;font-family:'Pretendard',sans-serif;color:#17181B">

  <div style="flex:1;min-height:0;box-sizing:border-box;padding:24px;background:#FBFAF7;border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:16px;-webkit-mask:radial-gradient(circle 12px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat">
    <div style="display:flex;justify-content:space-between;font:500 11px/1.4 'Monoplex KR',monospace;letter-spacing:.08em;color:#6B6964"><span>입장권 · 관람 기록</span><span>No.01—12</span></div>
    <div style="font:600 26px/1.3 'Noto Serif KR',serif;word-break:keep-all;text-wrap:balance">흰 절벽 — 한서윤 사진전</div>
    <div style="display:grid;grid-template-columns:48px minmax(0,1fr);border-top:1px solid #17181B;font:500 12px/1.5 'Monoplex KR',monospace;letter-spacing:.04em">
      <span style="padding:4px 0;border-bottom:1px solid #D6D3CD;color:#6B6964">날짜</span><span style="padding:4px 0;border-bottom:1px solid #D6D3CD">2026.10.17 토</span>
      <span style="padding:4px 0;border-bottom:1px solid #D6D3CD;color:#6B6964">시간</span><span style="padding:4px 0;border-bottom:1px solid #D6D3CD">13:05 — 15:20 · 2h 15m</span>
      <span style="padding:4px 0;border-bottom:1px solid #D6D3CD;color:#6B6964">장소</span><span style="padding:4px 0;border-bottom:1px solid #D6D3CD">국립현대미술관 서울</span>
      <span style="padding:4px 0;border-bottom:1px solid #D6D3CD;color:#6B6964">기록</span><span style="padding:4px 0;border-bottom:1px solid #D6D3CD">오브제 12 · 도슨트 05 · 노트 04</span>
    </div>
    <div style="flex:1"></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
      <div style="aspect-ratio:1;border-radius:2px;background:url(assets/cliff-sky.jpg) 8% 12%/300%"></div>
      <div style="aspect-ratio:1;border-radius:2px;background:url(assets/cliff-sky.jpg) 72% 38%/240%"></div>
      <div style="aspect-ratio:1;border-radius:2px;background:url(assets/cliff-dover.jpg) 55% 42%/cover"></div>
      <div style="aspect-ratio:1;border-radius:2px;background:url(assets/marble.jpg) 30% 50%/220%"></div>
    </div>
  </div>

  <div style="height:0;margin:0 16px;border-top:1px dashed #A3A09A;position:relative;z-index:1"></div>

  <div style="flex:none;box-sizing:border-box;padding:20px 24px 24px;background:#FBFAF7;border-radius:0 0 12px 12px;display:flex;flex-direction:column;gap:12px;-webkit-mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 12px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat">
    <div style="font:400 17px/1.8 'Noto Serif KR',serif;text-wrap:pretty">절벽은 하얗다기보다, 하늘을 오래 비춰서 푸르게 바랜 것 같았다.</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
      <span style="font:500 11px/1.4 'Monoplex KR',monospace;letter-spacing:.06em;color:#6B6964">No.07 · 나의 노트</span>
      <span style="font:600 15px/1 'Noto Serif KR',serif;letter-spacing:.02em">Athena</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:640}}"></script>
</body>
</html>
