<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:160},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lockup&quot;,&quot;stacked&quot;,&quot;mark&quot;,&quot;wordmark&quot;,&quot;appicon&quot;],&quot;default&quot;:&quot;lockup&quot;,&quot;tsType&quot;:&quot;'lockup'|'stacked'|'mark'|'wordmark'|'appicon'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;min&quot;:8,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#17181B&quot;,&quot;#FBFAF7&quot;,&quot;#1F4FA3&quot;],&quot;default&quot;:&quot;#17181B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;linear-gradient(180deg,#163A7A 0%,#1F4FA3 55%,#2E6BD1 100%)&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'lockup';
    const size = +(this.props.size ?? 64);
    const color = this.props.color ?? '#17181B';
    const bg = this.props.bg ?? 'linear-gradient(180deg,#163A7A 0%,#1F4FA3 55%,#2E6BD1 100%)';
    // master = sky-tile proportions: geometry and stroke scale together; stroke never renders under 0.75px
    let h = size, fs = size, gap = 0, shift = 0;
    if (variant === 'lockup') { fs = size * 0.4; gap = size * 0.28; shift = size * 0.06; }
    if (variant === 'stacked') { fs = size * 0.22; gap = size * 0.16; }
    if (variant === 'appicon') { h = size * 0.5 * 130 / 152; fs = size * 0.115; gap = size * 0.06; }
    const w = h * 152 / 130;
    const sw = Math.max(1.6, 0.75 * 130 / h);
    return {
      isMark: variant === 'mark', isLockup: variant === 'lockup', isStacked: variant === 'stacked',
      isWordmark: variant === 'wordmark', isAppIcon: variant === 'appicon',
      w: +w.toFixed(2), h: +h.toFixed(2), sw: +sw.toFixed(3), fs: +fs.toFixed(2), gap: +gap.toFixed(2), shift: +shift.toFixed(2),
      size, radius: +(size * 0.225).toFixed(2), color, bg
    };
  }
}
</script>
