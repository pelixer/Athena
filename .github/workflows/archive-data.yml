# 아트 아카이브 데이터 수집 (서버 없음). Wikidata(CC0)에서 시각 작품·작가·용어를 모아 정적 파일 묶음으로 만든다.
# 개발 컨테이너에서는 Wikidata에 닿지 않아 여기서 돌린다. 손으로만 실행한다 (Actions → archive-data → Run workflow).
name: archive-data

on:
  workflow_dispatch:
    inputs:
      step:
        description: "probe = 규모만 보기, collect = 수집해서 릴리스로 올리기"
        required: true
        default: probe
        type: choice
        options: [probe, collect]

permissions:
  contents: write # collect: 릴리스 만들기

concurrency:
  group: archive-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Probe
        if: inputs.step == 'probe'
        run: node scripts/archive/probe.mjs
